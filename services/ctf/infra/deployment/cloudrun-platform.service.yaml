# ==============================================================================
# Google Cloud Run Service Specification Template (Platform API)
#
# IMPORTANT:
# This is a deployment template. Values enclosed in angle brackets (<PROJECT_ID>,
# <REGION>, etc.) must be substituted before applying to Google Cloud.
# Secrets must reference Google Cloud Secret Manager, NEVER raw values.
#
# Apply using:
#   gcloud run services replace infra/deployment/cloudrun-platform.service.yaml
# ==============================================================================

apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: veyra-ctf-platform
  namespace: '<PROJECT_ID>' # FILL IN: Your GCP Project ID (e.g., veyra-ctf-prod-2026)
  labels:
    cloud.googleapis.com/location: '<REGION>' # FILL IN: e.g., us-central1 or europe-west1
    app.kubernetes.io/name: root-ctf-platform
    app.kubernetes.io/part-of: root-ctf
spec:
  template:
    metadata:
      annotations:
        # Autoscaling Configuration
        # ──────────────────────────────────────────────────────────────────────
        # minScale: Keeps at least 1 instance warm during the 3-day competition.
        # Eliminates container cold-starts on high-traffic paths (leaderboard & submit).
        # Set to 0 prior to event launch to maintain $0 idle spend.
        autoscaling.knative.dev/minScale: '1'

        # maxScale: Hard ceiling on max instances to prevent runaway cloud bills.
        # Sized for 5,000–10,000 active concurrent sessions with container concurrency=80.
        autoscaling.knative.dev/maxScale: '25'

        # CPU Allocation: "always-on" CPU during container lifetime ensures background
        # keepalives and connection pool management remain active.
        run.googleapis.com/cpu-throttling: 'false'

        # VPC Connector (Optional): Required if Postgres/Redis resides in a private VPC.
        # run.googleapis.com/vpc-access-connector: projects/<PROJECT_ID>/locations/<REGION>/connectors/<CONNECTOR_NAME>
        # run.googleapis.com/vpc-access-egress: private-ranges-only

    spec:
      # Max concurrent requests handled simultaneously by a single container instance
      containerConcurrency: 80
      timeoutSeconds: 30
      serviceAccountName: '<SERVICE_ACCOUNT_EMAIL>' # FILL IN: e.g., platform-runner@<PROJECT_ID>.iam.gserviceaccount.com

      containers:
        - image: '<IMAGE_REGISTRY_URL>/platform:latest' # FILL IN: e.g., gcr.io/<PROJECT_ID>/platform:v1.0.0
          ports:
            - name: http1
              containerPort: 8080

          # Resource Limits
          resources:
            limits:
              cpu: '1000m'    # 1 vCPU per container
              memory: '1024Mi' # 1 GiB RAM per container

          # Probes & Self-Healing
          # ──────────────────────────────────────────────────────────────────
          # Startup probe gives container time to verify DB/Redis connection
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 3
            failureThreshold: 10
            timeoutSeconds: 3

          # Liveness probe continuously checks honest /healthz
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 3

          # Environment Variables & Secret References
          # ──────────────────────────────────────────────────────────────────
          env:
            - name: NODE_ENV
              value: 'production'
            - name: PORT
              value: '8080'

            # Database Connection Strings (Referencing GCP Secret Manager)
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: veyra-database-direct-url
                  key: latest
            - name: DATABASE_POOLED_URL
              valueFrom:
                secretKeyRef:
                  name: veyra-database-pooled-url
                  key: latest

            # Cache Connection
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: veyra-redis-url
                  key: latest

            # Authentication Secrets
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: veyra-jwt-secret
                  key: latest
            - name: ADMIN_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: veyra-admin-jwt-secret
                  key: latest
            - name: RESET_TOKEN
              valueFrom:
                secretKeyRef:
                  name: veyra-reset-token
                  key: latest

            # Monitoring & Collaborator Domain
            - name: SENTRY_DSN
              valueFrom:
                secretKeyRef:
                  name: veyra-sentry-dsn
                  key: latest
            - name: COLLAB_BASE_DOMAIN
              value: '<COLLAB_DOMAIN>' # FILL IN: e.g., collab.rootctf.example.com
